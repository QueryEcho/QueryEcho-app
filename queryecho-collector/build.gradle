apply plugin: 'java-library'

dependencies {
    // collector가 리턴하는 TxMetricRecord가 sdk.dto.TxStatus를 그대로 노출하므로
    // implementation이 아니라 api로 선언 - 그래야 collector에 의존하는 모듈(dashboard 등)이
    // 별도로 queryecho-sdk를 직접 의존성에 추가하지 않아도 TxStatus 등을 컴파일 타임에 볼 수 있다.
    api project(':queryecho-sdk')
    // 원격 SDK가 보내는 지표를 받는 수신 API(MetricIngestController)를 제공하므로 web이 필요하다.
    // collector가 "서버"가 되는 순간부터 이건 선택이 아니라 필수 의존성이다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
}
