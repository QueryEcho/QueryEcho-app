<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">느린 Query 원인 분류</title>
  <desc id="desc">느린 Query의 원인을 SQL 설계, Index 설계, 데이터량, 동시성, DB 자원으로 나눈 트리 다이어그램</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #334155; }
      .root-text { font-size: 38px; font-weight: 750; fill: #FFFFFF; }
      .heading { font-size: 30px; font-weight: 750; }
      .item { font-size: 25px; font-weight: 500; }
      .connector { fill: none; stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #FFFFFF; stroke-width: 4; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#F8FAFC"/>

  <!-- Root -->
  <rect x="620" y="48" width="360" height="92" rx="24" fill="#0F172A"/>
  <text x="800" y="106" text-anchor="middle" class="text root-text">느린 Query</text>

  <!-- Shared backbone and first row branches -->
  <path d="M800 140 V192 M250 192 H1350" class="connector"/>
  <path d="M250 192 V232" class="connector" marker-end="url(#arrow)"/>
  <path d="M800 192 V232" class="connector" marker-end="url(#arrow)"/>
  <path d="M1350 192 V232" class="connector" marker-end="url(#arrow)"/>

  <!-- SQL design -->
  <rect x="65" y="245" width="370" height="300" rx="24" class="card" stroke="#3B82F6"/>
  <rect x="65" y="245" width="370" height="78" rx="21" fill="#EFF6FF"/>
  <path d="M65 300 V323 H435 V300" fill="#EFF6FF"/>
  <text x="250" y="296" text-anchor="middle" class="text heading" fill="#1D4ED8">SQL 설계</text>
  <circle cx="115" cy="370" r="6" fill="#3B82F6"/>
  <text x="140" y="379" class="text item">JOIN / N+1</text>
  <circle cx="115" cy="438" r="6" fill="#3B82F6"/>
  <text x="140" y="447" class="text item">OFFSET</text>
  <circle cx="115" cy="506" r="6" fill="#3B82F6"/>
  <text x="140" y="515" class="text item">Function</text>

  <!-- Index design -->
  <rect x="615" y="245" width="370" height="300" rx="24" class="card" stroke="#8B5CF6"/>
  <rect x="615" y="245" width="370" height="78" rx="21" fill="#F5F3FF"/>
  <path d="M615 300 V323 H985 V300" fill="#F5F3FF"/>
  <text x="800" y="296" text-anchor="middle" class="text heading" fill="#6D28D9">Index 설계</text>
  <circle cx="665" cy="370" r="6" fill="#8B5CF6"/>
  <text x="690" y="379" class="text item">선택도 / 순서</text>
  <circle cx="665" cy="438" r="6" fill="#8B5CF6"/>
  <text x="690" y="447" class="text item">인덱스 미사용</text>
  <circle cx="665" cy="506" r="6" fill="#8B5CF6"/>
  <text x="690" y="515" class="text item">과도한 Index</text>

  <!-- Data volume -->
  <rect x="1165" y="245" width="370" height="300" rx="24" class="card" stroke="#14B8A6"/>
  <rect x="1165" y="245" width="370" height="78" rx="21" fill="#F0FDFA"/>
  <path d="M1165 300 V323 H1535 V300" fill="#F0FDFA"/>
  <text x="1350" y="296" text-anchor="middle" class="text heading" fill="#0F766E">데이터량</text>
  <circle cx="1215" cy="392" r="6" fill="#14B8A6"/>
  <text x="1240" y="401" class="text item">Rows Scanned</text>
  <circle cx="1215" cy="472" r="6" fill="#14B8A6"/>
  <text x="1240" y="481" class="text item">데이터 분포</text>

  <!-- Second row branches, also from the root backbone -->
  <path d="M800 545 V656 M450 656 H1150" class="connector"/>
  <path d="M450 656 V696" class="connector" marker-end="url(#arrow)"/>
  <path d="M1150 656 V696" class="connector" marker-end="url(#arrow)"/>

  <!-- Concurrency -->
  <rect x="220" y="710" width="460" height="310" rx="24" class="card" stroke="#F59E0B"/>
  <rect x="220" y="710" width="460" height="78" rx="21" fill="#FFFBEB"/>
  <path d="M220 765 V788 H680 V765" fill="#FFFBEB"/>
  <text x="450" y="761" text-anchor="middle" class="text heading" fill="#B45309">동시성</text>
  <circle cx="280" cy="835" r="6" fill="#F59E0B"/>
  <text x="305" y="844" class="text item">Lock Wait</text>
  <circle cx="280" cy="890" r="6" fill="#F59E0B"/>
  <text x="305" y="899" class="text item">Deadlock</text>
  <circle cx="480" cy="835" r="6" fill="#F59E0B"/>
  <text x="505" y="844" class="text item">Hot Row</text>
  <circle cx="480" cy="890" r="6" fill="#F59E0B"/>
  <text x="505" y="899" class="text item">Long TX</text>

  <!-- DB resources -->
  <rect x="920" y="710" width="460" height="310" rx="24" class="card" stroke="#F43F5E"/>
  <rect x="920" y="710" width="460" height="78" rx="21" fill="#FFF1F2"/>
  <path d="M920 765 V788 H1380 V765" fill="#FFF1F2"/>
  <text x="1150" y="761" text-anchor="middle" class="text heading" fill="#BE123C">DB 자원</text>
  <circle cx="980" cy="835" r="6" fill="#F43F5E"/>
  <text x="1005" y="844" class="text item">CPU</text>
  <circle cx="980" cy="890" r="6" fill="#F43F5E"/>
  <text x="1005" y="899" class="text item">Memory</text>
  <circle cx="1165" cy="835" r="6" fill="#F43F5E"/>
  <text x="1190" y="844" class="text item">Disk I/O</text>
  <circle cx="1165" cy="890" r="6" fill="#F43F5E"/>
  <text x="1190" y="899" class="text item">Connection</text>
</svg>
