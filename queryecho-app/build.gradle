// 유일하게 실행 가능한 모듈. 여기서만 'org.springframework.boot' 플러그인을 적용해서
// bootJar/bootRun 태스크를 갖는다 - 나머지 모듈(sdk/collector/dashboard)은 라이브러리라서
// 실행 가능한 fat jar가 필요 없다.
apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':queryecho-sdk')
    implementation project(':queryecho-collector')
    implementation project(':queryecho-dashboard')

    // demo 패키지(DemoController 등)가 REST 컨트롤러를 직접 정의하므로 web 스타터가 필요
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 이 프로토타입이 관찰 대상으로 삼는 데모 DB(H2) 연결용
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
}
