spring.application.name=QueryEcho

# Demo/target datasource (this is the DB QueryEcho is observing).
# Swap this out for a real MySQL/PostgreSQL datasource once you move past the prototype.
spring.datasource.url=jdbc:h2:mem:queryecho;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# QueryEcho SDK settings (queryecho-sdk module)
queryecho.sdk.enabled=true
# LOCAL: SDK와 collector가 같은 JVM 안에 있음 (이 데모 앱의 경우).
# HTTP:  타깃 앱이 별도 프로세스일 때 원격 Collector로 배치 전송.
queryecho.sdk.transport=LOCAL
# transport=HTTP 일 때만 사용되는 설정들
#queryecho.sdk.collector-url=http://localhost:8080
#queryecho.sdk.buffer.capacity=10000
#queryecho.sdk.buffer.batch-size=200
#queryecho.sdk.buffer.flush-interval-ms=1000
#queryecho.sdk.buffer.request-timeout-ms=3000

# QueryEcho collector settings (queryecho-collector module)
queryecho.collector.slow-query-threshold-ms=300
queryecho.collector.n-plus-one.window-ms=1000
queryecho.collector.n-plus-one.threshold=5
