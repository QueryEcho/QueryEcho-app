spring.application.name=QueryEcho

# Collector metric storage PostgreSQL. Environment variables allow the same
# application artifact to point at Docker locally or a managed DB in production.
# The SDK explicitly excludes this DataSource so QueryEcho does not monitor its
# own INSERT/SELECT statements.
spring.datasource.url=${QUERYECHO_DB_URL:jdbc:postgresql://localhost:5433/queryecho}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${QUERYECHO_DB_USERNAME:queryecho}
spring.datasource.password=${QUERYECHO_DB_PASSWORD:queryecho}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Demo/target DB: this is the database observed by the local SDK.
queryecho.demo.datasource.url=jdbc:h2:mem:queryecho-target;DB_CLOSE_DELAY=-1
queryecho.demo.datasource.driver-class-name=org.h2.Driver
queryecho.demo.datasource.username=sa
queryecho.demo.datasource.password=

# QueryEcho SDK settings
queryecho.sdk.enabled=true
queryecho.sdk.transport=LOCAL
queryecho.sdk.app-name=queryecho-demo
queryecho.sdk.environment=local
queryecho.sdk.instance-id=local-instance-01
queryecho.sdk.db-type=h2
queryecho.sdk.excluded-datasource-beans[0]=queryEchoStorageDataSource
queryecho.sdk.excluded-transaction-packages[0]=com.queryecho.queryecho.collector

# Parameters are not collected unless both enabled and explicitly allowlisted.
queryecho.sdk.params.enabled=false

# Rollback exception messages can contain personal or secret values. Exception type is
# still collected, while the message remains opt-in and length-limited.
queryecho.sdk.transaction.failure-message-enabled=false
queryecho.sdk.transaction.failure-message-max-length=1000

# HTTP transport example
#queryecho.sdk.collector-url=http://localhost:8080
#queryecho.sdk.buffer.capacity=10000
#queryecho.sdk.buffer.batch-size=200
#queryecho.sdk.buffer.flush-interval-ms=1000
#queryecho.sdk.buffer.request-timeout-ms=3000

# Collector analysis/storage settings
queryecho.collector.slow-query-threshold-ms=300
queryecho.collector.n-plus-one.window-ms=1000
queryecho.collector.n-plus-one.threshold=5
queryecho.collector.rollup.lookback-minutes=10
queryecho.collector.rollup.interval-ms=60000
queryecho.collector.retention.execution-days=7

# Optional MySQL server-side collector. It observes DBeaver/CLI/other-language clients
# through performance_schema, independently of the Java SDK. Enable explicitly because
# production credentials and permissions must never be guessed.
queryecho.db-collector.mysql.enabled=${QUERYECHO_MYSQL_COLLECTOR_ENABLED:false}
queryecho.db-collector.mysql.jdbc-url=${QUERYECHO_MYSQL_COLLECTOR_URL:jdbc:mysql://localhost:3307/performance_schema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
queryecho.db-collector.mysql.username=${QUERYECHO_MYSQL_COLLECTOR_USERNAME:queryecho_monitor}
queryecho.db-collector.mysql.password=${QUERYECHO_MYSQL_COLLECTOR_PASSWORD:queryecho_monitor}
queryecho.db-collector.mysql.instance-id=${QUERYECHO_MYSQL_INSTANCE_ID:mysql-local-01}
queryecho.db-collector.mysql.schema=${QUERYECHO_MYSQL_SCHEMA:querytest}
queryecho.db-collector.mysql.poll-interval-ms=${QUERYECHO_MYSQL_POLL_INTERVAL_MS:1000}
queryecho.db-collector.mysql.batch-size=${QUERYECHO_MYSQL_BATCH_SIZE:2000}

# PostgreSQL exposes completed query patterns as cumulative pg_stat_statements rather
# than a portable per-execution history, so this adapter stores poll-to-poll deltas.
queryecho.db-collector.postgresql.enabled=${QUERYECHO_POSTGRES_COLLECTOR_ENABLED:false}
queryecho.db-collector.postgresql.jdbc-url=${QUERYECHO_POSTGRES_COLLECTOR_URL:jdbc:postgresql://localhost:5434/querytest}
queryecho.db-collector.postgresql.username=${QUERYECHO_POSTGRES_COLLECTOR_USERNAME:queryecho_monitor}
queryecho.db-collector.postgresql.password=${QUERYECHO_POSTGRES_COLLECTOR_PASSWORD:queryecho_monitor}
queryecho.db-collector.postgresql.instance-id=${QUERYECHO_POSTGRES_INSTANCE_ID:postgresql-local-01}
queryecho.db-collector.postgresql.database=${QUERYECHO_POSTGRES_DATABASE:querytest}
queryecho.db-collector.postgresql.poll-interval-ms=${QUERYECHO_POSTGRES_POLL_INTERVAL_MS:5000}
