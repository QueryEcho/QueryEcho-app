name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test all modules
        run: ./gradlew test --no-daemon
      - name: Verify SDK publication artifacts
        run: ./gradlew :queryecho-sdk:publishToMavenLocal -PVERSION_NAME=0.1.0-SNAPSHOT --no-daemon
      - name: Build server image
        run: docker build -t queryecho-app:ci .

