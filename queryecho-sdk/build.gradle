// SDK 모듈: 다른 애플리케이션에도 라이브러리로 추가될 예정이라, 실행 가능한 jar(bootJar)를
// 만드는 'org.springframework.boot' 플러그인은 일부러 적용하지 않는다. 'java-library'만으로
// 충분하고, 버전 관리(BOM)는 루트 build.gradle의 subprojects 블록에서 이미 받고 있다.
apply plugin: 'java-library'
apply plugin: 'com.vanniktech.maven.publish'

// 다른 모듈과 달리 여기서는 버전을 명시한다. io.spring.dependency-management(Spring BOM)가
// 관리해주는 버전은 이 레포 안에서만 유효한 "관리된 버전"이라서, 이 jar를 완전히 별도인
// 외부 프로젝트가 mavenLocal()로 받아갈 때는 그 BOM이 적용돼 있지 않다. 버전이 없는 채로
// publish하면 외부 프로젝트에서 "어느 버전을 받아야 할지 몰라 의존성 해석 실패"가 난다.
// (spring-boot-dependencies:4.1.0 BOM이 실제로 관리하는 버전을 그대로 고정한 것뿐이라,
// 루트에서 BOM 버전을 올리면 이 값도 같이 맞춰줘야 한다.)
dependencies {
    // @Aspect, @Around, ProceedingJoinPoint (AspectJ) + spring-aop 프록시 인프라
    implementation 'org.springframework.boot:spring-boot-starter-aspectj:4.1.0'
    // @AutoConfiguration, @ConditionalOnClass, @ConditionalOnProperty.
    // 전이 의존성으로도 들어오지만, 이 SDK가 "자동 구성을 제공하는 라이브러리"라는 사실이
    // 곧 이 의존성의 존재 이유이므로 명시적으로 선언한다.
    implementation 'org.springframework.boot:spring-boot-autoconfigure:4.1.0'
    // TransactionSynchronizationManager, @EnableTransactionManagement
    implementation 'org.springframework:spring-tx:7.0.8'
    // 수집된 이벤트를 Collector 서버로 보낼 때 쓰는 JSON 직렬화.
    // HTTP 클라이언트는 JDK 내장 java.net.http.HttpClient를 쓰므로 별도 의존성이 없지만,
    // JSON만큼은 직접 문자열을 조립하면 이스케이프 처리에서 버그가 나기 쉬워 Jackson을 쓴다.
    // Spring Boot 4.x는 Jackson 3(tools.jackson)을 기본으로 쓰므로 여기서도 3.x를 맞춘다.
    implementation 'tools.jackson.core:jackson-databind:3.1.4'
}

def sdkVersion = providers.gradleProperty('VERSION_NAME').orElse('0.1.0-SNAPSHOT').get()

group = 'io.github.queryecho'
version = sdkVersion

mavenPublishing {
    publishToMavenCentral()
    coordinates('io.github.queryecho', 'queryecho-sdk', sdkVersion)

    pom {
        name = 'QueryEcho SDK'
        description = 'Lightweight JDBC and Spring transaction telemetry SDK for QueryEcho.'
        inceptionYear = '2026'
        url = 'https://github.com/QueryEcho/QueryEcho-app'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'queryecho'
                name = 'QueryEcho maintainers'
                url = 'https://github.com/QueryEcho'
            }
        }
        scm {
            url = 'https://github.com/QueryEcho/QueryEcho-app'
            connection = 'scm:git:git://github.com/QueryEcho/QueryEcho-app.git'
            developerConnection = 'scm:git:ssh://git@github.com/QueryEcho/QueryEcho-app.git'
        }
    }
}
